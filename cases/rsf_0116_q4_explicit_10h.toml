[case]
name = "pmma-rsf-q4-explicit-h050-dt15ns-d245-stop440"
run_root = "runs"

[geometry.moving]
origin = [0.0, 0.0]
dimensions = [200.0, 500.0]

[geometry.stationary]
origin = [200.0, 0.0]
dimensions = [145.0, 550.0]

[material]
# Consistent PMMA units: mm, s, MPa, tonne/mm^3.
density = 1.148e-9
young_modulus = 7662.0
poisson_ratio = 0.2

[loading]
normal_stress_reference = 16.0
normal_displacement = 0.691620986687549
# Normal loading is dynamically relaxed before the undamped shear stage.
normal_phase_time = 0.003
normal_ramp_time = 0.0005
normal_relaxation_time = 0.0002
shear_displacement_initial = 0.0
shear_displacement_final = 2.45
# All tangential loading is explicit; no shear displacement is applied during
# the normal-relaxation phase.
quasistatic_shear_fraction = 0.0
quasistatic_shear_start_time = 0.0
quasistatic_shear_ramp_time = 0.0
shear_phase_time = 0.029
shear_ramp_time = 0.010
shear_ramp_shape = "half-cosine"
stop_on_rupture = true
stop_slip = 0.00629795
stop_velocity = 10.0
# Freeze the loading face when the forward front reaches y=440 mm. Coarse-grid
# pilots show that the remaining fault then ruptures without continued input.
stop_min_y = 440.0
stop_max_y = 440.0
lock_shear_edge_during_normal = true
# Build only the normal prestress during relaxation. RSF state and tangential
# traction start from their prescribed initial values in the explicit phase.
relax_tangential_contact_during_normal = true

[numerics]
mesh_size = 0.50
cfl = 0.35
# Keep the assembled contact limit above the explicitly requested step.
contact_safety_factor = 0.50
# Exact 15 ns step; the solver rejects this case if the assembled Q4 stability
# limit ever falls below the requested value.
time_step = 1.5e-8
dtype = "float32"
operator_batch_size = 65536

[output]
# 1.5x the completed Q4 run: about 0.806 us between bulk shear frames and
# 0.097 us between high-rate interface frames.
bulk_normal_frames = 2
bulk_shear_frames = 36000
interface_normal_frames = 100
interface_shear_frames = 300000
compression = "lzf"
# The completed 24k-frame run measured 0.9504; 0.955 retains a small margin
# against weaker compression in a fully ruptured field.
estimated_compression_ratio = 0.955
include_initial_frame = false
# The uncompressed estimate is 1.253 TB and the calibrated estimate is 1.196 TB.
maximum_dump_tb = 1.20
checkpoint_interval_minutes = 10.0

[rsf]
initial_friction = 0.8
reference_velocity = 1.0e-4
reference_state = 3.3e-4
initial_steady_velocity = 1.0e-4
dynamic_calibration_velocity = 2000.0
target_middle_dynamic_friction = 0.45
loading_length = 30.0
leading_length = 30.0
transition_length = 10.0

[rsf.loading]
a = 0.004
b = 0.035
dc = 0.00629795

[rsf.middle]
a = 0.005
b = 0.025819400653936703
dc = 0.00629795

[rsf.leading]
a = 0.008
b = 0.005
dc = 0.00629795
