[case]
name = "pmma-rsf-0116-h010"
run_root = "runs"

[geometry.moving]
origin = [0.0, 0.0]
dimensions = [200.0, 500.0]

[geometry.stationary]
origin = [200.0, 0.0]
dimensions = [145.0, 550.0]

[material]
# Consistent legacy PMMA units: mm, s, MPa, tonne/mm^3.
density = 1.148e-9
young_modulus = 7662.0
poisson_ratio = 0.2

[loading]
# The loading path is the converged run 0116 path, but friction is now RSF.
normal_stress_reference = 16.0
normal_displacement = 0.691620986687549
normal_phase_time = 0.040
normal_ramp_time = 0.020
shear_displacement_initial = 0.0
shear_displacement_final = 1.76
shear_phase_time = 0.030
shear_ramp_time = 0.010
shear_ramp_shape = "half-cosine"
stop_on_rupture = true
stop_slip = 0.00629795
stop_min_y = 0.0
stop_max_y = 440.0
lock_shear_edge_during_normal = true

[numerics]
# 0.10 mm gives about 35.98 million mechanical DOFs.
mesh_size = 0.10
cfl = 0.35
dtype = "float32"
operator_batch_size = 65536

[output]
# Full fields are deliberately sparse; the fault history remains high-rate.
bulk_normal_frames = 120
bulk_shear_frames = 480
interface_normal_frames = 4800
interface_shear_frames = 95000
compression = "lzf"
include_initial_frame = false
maximum_dump_tb = 1.0
checkpoint_interval_minutes = 20.0

[rsf]
initial_friction = 0.8
reference_velocity = 1.0e-4       # mm/s
reference_state = 3.3e-4          # s
initial_steady_velocity = 1.0e-4  # mm/s
dynamic_calibration_velocity = 2000.0
target_middle_dynamic_friction = 0.45
loading_length = 30.0
leading_length = 30.0
transition_length = 10.0

[rsf.loading]
# Strong velocity weakening: a - b = -0.031.
a = 0.004
b = 0.035
dc = 0.00629795

[rsf.middle]
# Calibrated to mu=0.45 at steady V=2 m/s from the former 0.8 -> 0.45 LSW drop.
a = 0.005
b = 0.025819400653936703
dc = 0.00629795

[rsf.leading]
# Mild velocity strengthening: a - b = +0.003, replacing ad-hoc creep.
a = 0.008
b = 0.005
dc = 0.00629795
