[case]
name = "pmma-rsf-0349-nucleation-14of16"
run_root = "runs"

[geometry.moving]
origin = [0.0, 0.0]
dimensions = [200.0, 500.0]
# Continuous RSF loading; full rectangular block without a chamfer.
leading_chamfer_along_fault = 0.0
leading_chamfer_perpendicular = 0.0

[geometry.stationary]
origin = [200.0, 0.0]
dimensions = [145.0, 550.0]

[material]
density = 1.148e-9
young_modulus = 7662.0
poisson_ratio = 0.2

[loading]
# Uniform traction on moving-block-back; positive means compression.
normal_loading_mode = "stress"
normal_stress_reference = 16.0
normal_displacement = 0.691620986687549
normal_phase_time = 0.040
normal_ramp_time = 0.020
shear_displacement_initial = 0.0
shear_displacement_final = 2.45
quasistatic_shear_fraction = 0.0
quasistatic_shear_start_time = 0.0
quasistatic_shear_ramp_time = 0.0
shear_phase_time = 0.095000000000000001
# Fixed 2.45 mm ramp; nominal peak speed 76.96902 mm/s.
shear_ramp_time = 0.050000000000000003
shear_ramp_shape = "half-cosine"
stop_on_rupture = true
# Freeze on the first loading-end V >= 500 mm/s; no coverage delay.
stop_slip = 1.0e-12
stop_velocity = 500.0
stop_min_y = 5.0
# Monitor the same y = 5-25 mm interval as TS0320-TS0335.
stop_max_y = 25.0
lock_shear_edge_during_normal = true
relax_tangential_contact_during_normal = false

[numerics]
mesh_size = 0.50
cfl = 0.35
contact_safety_factor = 0.50
time_step = 1.0e-8
dtype = "float32"
operator_batch_size = 65536

[output]
bulk_normal_frames = 2
bulk_shear_frames = 4400
interface_normal_frames = 1000
interface_shear_frames = 100000
compression = "lzf"
estimated_compression_ratio = 0.955
include_initial_frame = false
maximum_dump_tb = 0.10
checkpoint_interval_minutes = 10.0
store_bulk_strain = false
store_bulk_velocity = false

[rsf]
initial_friction = 0.8
reference_velocity = 1.0e-4
reference_state = 3.3e-4
initial_steady_velocity = 1.0e-4
# theta0 = Dc/V_init; evolve continuously, without a phase reset.
initial_state_mode = "steady-state"
dynamic_calibration_velocity = 200.0
target_middle_dynamic_friction = 0.45
loading_length = 30.0
leading_length = 30.0
# Legacy fallback retained for old readers; the explicit values decouple ends.
transition_length = 50.0
loading_transition_length = 50.0
# Direct middle-to-leading step; no half-cosine transition.
leading_transition_length = 0

[rsf.loading]
# TS0143: no loading-end VN zone; identical to the middle VW law.
a = 0.02
b = 0.04412352722820527
dc = 0.00028284880005028539

[rsf.middle]
a = 0.02
b = 0.04412352722820527
dc = 0.00028284880005028539

[rsf.leading]
# Leading sweep 04/16, VS-to-VN, fraction=0.428571429.
f0 = 0.8
a = 0.0067142857142857143
b = 0.0050000000000000001
dc = 0.00042852936846183833
