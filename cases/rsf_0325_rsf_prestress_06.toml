[case]
name = "pmma-rsf-0325-prestress-06of16"
run_root = "runs"

[geometry.moving]
origin = [0.0, 0.0]
dimensions = [200.0, 500.0]
# Retain the TS0319 full rectangular moving block.
leading_chamfer_along_fault = 0.0
leading_chamfer_perpendicular = 0.0

[geometry.stationary]
origin = [200.0, 0.0]
dimensions = [145.0, 550.0]

[material]
density = 1.148e-9
young_modulus = 7662.0
poisson_ratio = 0.2

[loading]
# Uniform traction on moving-block-back; positive means compression.
normal_loading_mode = "stress"
normal_stress_reference = 16.0
normal_displacement = 0.691620986687549
normal_phase_time = 0.040
normal_ramp_time = 0.020
# Damping is enabled only for the static initial-condition construction.
normal_relaxation_time = 0.0002
normal_relaxation_start_time = 0.02
shear_displacement_initial = 0.0
shear_displacement_final = 4.183430490491534
# Build a static traction field while RSF is inactive, then invert the
# regularized law so theta supports that traction at V_init.
prestress_shear_displacement = 1.7334304904915339
quasistatic_shear_fraction = 0.0
quasistatic_shear_start_time = 0.02
quasistatic_shear_ramp_time = 0.01
shear_phase_time = 0.074999999999999997
# Add the same 2.45 mm half-cosine increment; peak speed 200 mm/s.
shear_ramp_time = 0.01924225500323749
shear_ramp_shape = "half-cosine"
stop_on_rupture = true
# Freeze on the first dynamic loading-end event in this shear phase.
stop_slip = 1.0e-12
stop_velocity = 500.0
stop_min_y = 5.0
# Monitor only the loading-end nucleus.
stop_max_y = 25.0
# A single station at 500 mm/s is sufficient; no coverage criterion.
lock_shear_edge_during_normal = true
relax_tangential_contact_during_normal = false

[numerics]
mesh_size = 0.50
cfl = 0.35
contact_safety_factor = 0.50
time_step = 1.0e-8
dtype = "float32"
operator_batch_size = 65536

[output]
bulk_normal_frames = 2
bulk_shear_frames = 4400
interface_normal_frames = 100
interface_shear_frames = 50000
compression = "lzf"
estimated_compression_ratio = 0.955
include_initial_frame = false
maximum_dump_tb = 0.10
checkpoint_interval_minutes = 10.0
store_bulk_strain = false
store_bulk_velocity = false

[rsf]
initial_friction = 0.8
reference_velocity = 1.0e-4
reference_state = 3.3e-4
initial_steady_velocity = 1.0e-4
initial_state_mode = "traction-consistent-handoff"
target_normalized_prestress = 0.57499999999999996
# Target mean shear traction: 11.0873983 MPa.
dynamic_calibration_velocity = 200.0
target_middle_dynamic_friction = 0.45
loading_length = 30.0
leading_length = 30.0
# Legacy fallback retained for old readers; the explicit values decouple ends.
transition_length = 50.0
loading_transition_length = 50.0
# Direct middle-to-leading step; no half-cosine transition.
leading_transition_length = 0

[rsf.loading]
# TS0143: no loading-end VN zone; identical to the middle VW law.
a = 0.005
b = 0.029123527228205267
dc = 0.00042852936846183833

[rsf.middle]
a = 0.005
b = 0.029123527228205267
dc = 0.00042852936846183833

[rsf.leading]
# Retain the TS0319 leading velocity-strengthening parameters.
f0 = 0.8
a = 0.0067142857142857143
b = 0.0050000000000000001
dc = 0.00042852936846183833
