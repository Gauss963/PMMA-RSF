[case]
name = "pmma-rsf-0118-czm-xc5mm-terminal-ramp"
run_root = "runs"

[geometry.moving]
origin = [0.0, 0.0]
dimensions = [200.0, 500.0]

[geometry.stationary]
origin = [200.0, 0.0]
dimensions = [145.0, 550.0]

[material]
# Consistent PMMA units: mm, s, MPa, tonne/mm^3.
density = 1.148e-9
young_modulus = 7662.0
poisson_ratio = 0.2

[loading]
normal_stress_reference = 16.0
normal_displacement = 0.691620986687549
normal_phase_time = 0.003
normal_ramp_time = 0.0005
normal_relaxation_time = 0.0002
shear_displacement_initial = 0.0
# The 1 mm pilot reached full rupture and stopped loading at 2.120 mm. The
# small margin keeps the target-mesh case on the full-rupture side.
shear_displacement_final = 2.22
quasistatic_shear_fraction = 0.0
quasistatic_shear_start_time = 0.0
quasistatic_shear_ramp_time = 0.0
shear_phase_time = 0.029
shear_ramp_time = 0.029
shear_ramp_shape = "half-cosine"
stop_on_rupture = true
stop_slip = 0.0003765049284695767
stop_velocity = 10.0
# The edge-loaded prestress does not support free propagation across the full
# fault. Stop external work near the far end, when the half-cosine velocity is
# already low; do not describe this case as a fully spontaneous rupture.
stop_min_y = 440.0
stop_max_y = 440.0
lock_shear_edge_during_normal = true
relax_tangential_contact_during_normal = true

[numerics]
mesh_size = 0.50
cfl = 0.35
contact_safety_factor = 0.50
# Exact 10 ns step; the solver rejects the case if the assembled Q4 stability
# limit is ever lower than the requested value.
time_step = 1.0e-8
dtype = "float32"
operator_batch_size = 65536

[output]
# About 0.806 us between bulk shear frames and 0.097 us between high-rate
# interface frames. A smaller integration step does not duplicate dump frames.
bulk_normal_frames = 2
bulk_shear_frames = 36000
interface_normal_frames = 100
interface_shear_frames = 300000
compression = "lzf"
estimated_compression_ratio = 0.955
include_initial_frame = false
# Uncompressed: 1.253 TB; calibrated LZF estimate: 1.196 TB.
maximum_dump_tb = 1.20
checkpoint_interval_minutes = 10.0

[rsf]
initial_friction = 0.8
reference_velocity = 1.0e-4
reference_state = 3.3e-4
initial_steady_velocity = 1.0e-4
dynamic_calibration_velocity = 2000.0
target_middle_dynamic_friction = 0.45
loading_length = 30.0
leading_length = 30.0
transition_length = 10.0

# CohesiveZoneModel/Lc_estimate.py at X_c=5 mm. The loading zone is velocity
# neutral because a=b; its smaller b is paired with the same smaller a and is
# not a separate steady-state weakening mechanism.
[rsf.loading]
a = 0.004
b = 0.004
dc = 0.0003765049284695767

[rsf.middle]
a = 0.005
b = 0.025819400653936703
dc = 0.0003765049284695767

[rsf.leading]
a = 0.008
b = 0.005
dc = 0.0003765049284695767
